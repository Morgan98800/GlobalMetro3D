[build]
  command = "npm run build:web"
  publish = "web/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Scheduled CRONs disabled while RT feeds are opt-in (?rt=1) to save serverless quota;
# HTTP endpoints (/api/*) remain live on demand.
[functions."prim_relay"]
  # schedule = "*/3 * * * *"

[functions."stm_relay"]
  # schedule = "*/2 * * * *"

[functions."tfl_relay"]
  # schedule = "* * * * *"

[functions."lille_relay"]
  # schedule = "* * * * *"

[functions."washington_relay"]
  # schedule = "* * * * *"

[functions."berlin_relay"]
  # schedule = "* * * * *"

[[redirects]]
  from = "/api/prim"
  to = "/.netlify/functions/prim_relay"
  status = 200

[[redirects]]
  from = "/api/prim_delays"
  to = "/.netlify/functions/prim_relay"
  status = 200

[[redirects]]
  from = "/api/stm"
  to = "/.netlify/functions/stm_relay"
  status = 200

[[redirects]]
  from = "/api/tfl"
  to = "/.netlify/functions/tfl_relay"
  status = 200

[[redirects]]
  from = "/api/tfl_arrivals"
  to = "/.netlify/functions/tfl_relay"
  status = 200

[[redirects]]
  from = "/api/lille-rt"
  to = "/.netlify/functions/lille_relay"
  status = 200

[[redirects]]
  from = "/api/washington-rt"
  to = "/.netlify/functions/washington_relay"
  status = 200

[[redirects]]
  from = "/api/berlin-rt"
  to = "/.netlify/functions/berlin_relay"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' https://cdn.fontshare.com https://tiles.openfreemap.org data:; img-src 'self' data: blob: https:; worker-src 'self' blob:; connect-src 'self' blob: data: https://photon.komoot.io https://api-adresse.data.gouv.fr https://tiles.openfreemap.org https://overturemaps-extras-us-west-2.s3.us-west-2.amazonaws.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

