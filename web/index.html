<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Métro de Paris 3D — Visualiseur cartographique</title>

    <meta name="description" content="Visualiseur cartographique 3D et simulation cinématique en temps réel du réseau de métro et RER parisien, propulsé par les données GTFS et PRIM d'Île-de-France Mobilités." />
    <meta name="theme-color" content="#F2F0EB" />
    <link rel="canonical" href="https://parisian3dsubway.netlify.app/" />

    <script>
      (function () {
        var theme = localStorage.getItem('paris-subway-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      })();
    </script>

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Métro de Paris 3D" />
    <meta property="og:title" content="Métro de Paris 3D — Visualiseur cartographique" />
    <meta property="og:description" content="Visualiseur cartographique 3D et simulation cinématique en temps réel du réseau de métro et RER parisien, propulsé par les données GTFS et PRIM d'Île-de-France Mobilités." />
    <meta property="og:url" content="https://parisian3dsubway.netlify.app/" />
    <meta property="og:image" content="https://parisian3dsubway.netlify.app/og-image.png" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Métro de Paris 3D — Visualiseur cartographique" />
    <meta name="twitter:description" content="Visualiseur cartographique 3D et simulation cinématique en temps réel du réseau de métro et RER parisien, propulsé par les données GTFS et PRIM d'Île-de-France Mobilités." />
    <meta name="twitter:image" content="https://parisian3dsubway.netlify.app/og-image.png" />
    
    <!-- Typographie : Switzer seul. Cabinet Grotesk et Inter sont retirés
         du produit (charte, §Typographie). Une police distante se charge
         par <link> dans le <head>, jamais par @import : sur file://
         l'import distant échoue silencieusement (origine opaque). -->
    <link rel="preconnect" href="https://api.fontshare.com">
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet">
    
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Ordre de dépendance des feuilles (annexe B du prompt) :
         jetons → typographie → mouvement → couche d'application.
         main.css reste en dernier : c'est le seul mécanisme d'override
         du dépôt, il n'y a pas de !important de confort. -->
    <link rel="stylesheet" href="../core/ui/styles/tokens.css" />
    <link rel="stylesheet" href="../core/ui/styles/typography.css" />
    <link rel="stylesheet" href="../core/ui/styles/motion.css" />
    <link rel="stylesheet" href="../core/ui/styles/main.css" />

    <script>
      // Cleanly suppress any injected Netlify HUD, drawer, or feedback widget
      function suppressNetlifyElements() {
        const sel = 'script[src*="netlify/scripts/hud"], [data-netlify-site-id], [data-nf-variant], netlify-drawer, #netlify-drawer, .netlify-drawer, div[id*="netlify"], div[class*="netlify"], iframe[src*="netlify"]';
        document.querySelectorAll(sel).forEach(el => el.remove());
      }
      suppressNetlifyElements();
      const obs = new MutationObserver(suppressNetlifyElements);
      obs.observe(document.documentElement, { childList: true, subtree: true });
      window.addEventListener('DOMContentLoaded', suppressNetlifyElements);
      window.addEventListener('load', suppressNetlifyElements);
    </script>
  </head>
  <body>
    <div class="app-loader" id="app-loader" role="status" aria-live="polite">
      <div class="app-loader__train" aria-hidden="true"><span></span><span></span><span></span></div>
      <p>Chargement du réseau parisien</p>
    </div>
    <!-- Semantic header for robots & assistive technology -->
    <h1 class="sr-only">Métro de Paris 3D — Visualiseur cartographique et simulation en temps réel</h1>

    <noscript>
      <div style="padding: 2rem; background: #150E12; color: #F1EFEA; font-family: sans-serif; text-align: center;">
        <h2>Métro de Paris 3D — Visualiseur cartographique</h2>
        <p>Cette application interactive 3D nécessite l'activation de JavaScript et le support de WebGL pour le rendu de la carte vectorielle et la simulation cinématique en temps réel.</p>
        <p><a href="/methode.html" style="color: #C9A227; text-decoration: underline;">Consulter la documentation et méthode technique</a></p>
      </div>
    </noscript>

    <div id="app">
      <div id="map"></div>

      <!-- Modal / popup container for station search -->
      <div id="search-container" class="search-modal-wrap" style="display: none;"></div>

      <!-- View controls (Contextual Recenter) -->
      <aside class="map-controls" id="map-controls" aria-label="Contrôles de vue">
        <button class="map-control-btn" id="btn-recenter" title="Recadrer sur le réseau" aria-label="Recadrer sur le réseau de métro">
          <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18">
            <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.8" fill="none"/>
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
            <line x1="12" y1="2" x2="12" y2="5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="12" y1="19" x2="12" y2="22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="2" y1="12" x2="5" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="19" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </aside>

      <!-- Lateral dock / Mobile Bottom Sheet ("Le Quai") -->
      <nav class="dock" id="dock" aria-label="Sélection de ligne et stations">
        <div class="dock-handle" id="dock-handle" title="Glisser pour afficher / masquer"></div>
        <div class="dock-header">
          <span class="dock-title">Lignes du réseau</span>
          <div class="dock-header-actions">
            <button class="dock-collapse-btn" id="dock-collapse" type="button" aria-label="Réduire le panneau" aria-expanded="true" title="Réduire le panneau"></button>
            <button class="dock-reset-btn" id="dock-reset" style="display: none;">Tout afficher</button>
          </div>
        </div>
        <!-- Grille et contenu partagent une seule zone défilante : la grille
             était auparavant une soeur de .dock-content, donc hors de la zone
             défilante, et se retrouvait rognée par .dock{overflow:hidden}
             au-delà de sa hauteur maximale (à 320 px : 6 pastilles coupées). -->
        <div class="dock-scroll" id="dock-scroll">
          <div class="lines-grid" id="lines-grid" role="group" aria-label="Liste des 21 lignes"></div>
          <div class="dock-content" id="dock-content">
            <div class="dock-empty-state"><p>Chargement des lignes, stations et horaires GTFS…</p></div>
          </div>
        </div>
      </nav>

      <!-- Interactive Tooltip -->
      <div class="map-tooltip" id="tooltip">
        <div class="tooltip-name" id="tooltip-name"></div>
        <div class="tooltip-lines" id="tooltip-lines"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
