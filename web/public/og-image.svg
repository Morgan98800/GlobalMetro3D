<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#150E12; font-family:'Cabinet Grotesk', 'Switzer', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Vignette Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a1b24" />
      <stop offset="55%" stop-color="#181016" />
      <stop offset="100%" stop-color="#0e080c" />
    </radialGradient>
    
    <!-- Metro Line Gradients -->
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCD00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFCD00" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="line4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE418D" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#BE418D" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="line6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70C392" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#70C392" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="line14" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#62259D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#62259D" stop-opacity="0.15" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Abstract stylized 3D rail network curves -->
  <g opacity="0.35" transform="rotate(-12 600 315)">
    <!-- Seine curve -->
    <path d="M-100,280 C200,320 400,240 700,380 C1000,520 1200,420 1400,460" fill="none" stroke="#2b4759" stroke-width="28" opacity="0.4" />
    
    <!-- Metro lines tracks -->
    <path d="M-50,220 C250,230 550,260 850,290 C1050,310 1250,330 1350,340" fill="none" stroke="url(#line1)" stroke-width="6" />
    <path d="M300,-50 C380,200 480,450 600,700" fill="none" stroke="url(#line4)" stroke-width="6" />
    <path d="M100,500 C300,520 600,540 850,480 C1050,420 1250,280 1350,180" fill="none" stroke="url(#line6)" stroke-width="6" />
    <path d="M-100,580 C250,480 650,320 1000,160 C1150,100 1300,40 1400,-20" fill="none" stroke="url(#line14)" stroke-width="8" filter="url(#glow)" />
    
    <!-- Track grid dots / stations -->
    <circle cx="450" cy="250" r="7" fill="#F1EFEA" stroke="#FFCD00" stroke-width="3" />
    <circle cx="650" cy="270" r="7" fill="#F1EFEA" stroke="#FFCD00" stroke-width="3" />
    <circle cx="480" cy="450" r="7" fill="#F1EFEA" stroke="#BE418D" stroke-width="3" />
    <circle cx="680" cy="310" r="9" fill="#F1EFEA" stroke="#62259D" stroke-width="4" filter="url(#glow)" />
    <circle cx="880" cy="220" r="8" fill="#F1EFEA" stroke="#62259D" stroke-width="3" />
  </g>

  <!-- Content Container with Glassmorphism Card Frame -->
  <rect x="70" y="65" width="1060" height="500" rx="16" fill="#1E1419" fill-opacity="0.82" stroke="#3B2830" stroke-width="1.5" />

  <!-- Brand / Kicker -->
  <g transform="translate(120, 130)">
    <!-- Roundel Icon -->
    <circle cx="16" cy="16" r="16" fill="none" stroke="#C9A227" stroke-width="3" />
    <circle cx="16" cy="16" r="8" fill="#C9A227" />
    
    <text x="48" y="22" fill="#C9A227" font-size="15" font-weight="700" letter-spacing="3">MÉTRO DE PARIS 3D</text>
  </g>

  <!-- Title -->
  <text x="120" y="240" fill="#F1EFEA" font-size="52" font-weight="800" letter-spacing="-0.5">Visualiseur cartographique</text>
  <text x="120" y="300" fill="#C9A227" font-size="44" font-weight="700" letter-spacing="-0.5">&amp; simulation en temps réel</text>

  <!-- Description -->
  <text x="120" y="365" fill="#A8949C" font-size="20" font-weight="400">
    Simulation cinématique continue des rames sur le réseau ferré souterrain et aérien.
  </text>
  <text x="120" y="398" fill="#A8949C" font-size="20" font-weight="400">
    Encadrement précis à partir des horaires GTFS et des prédictions PRIM d'Île-de-France Mobilités.
  </text>

  <!-- Feature Badges -->
  <g transform="translate(120, 460)">
    <!-- Badge 1: 16 Lignes de Métro -->
    <rect x="0" y="0" width="180" height="38" rx="8" fill="#291B21" stroke="#3B2830" stroke-width="1" />
    <text x="90" y="24" fill="#F1EFEA" font-size="13" font-weight="600" text-anchor="middle">16 LIGNES DE MÉTRO</text>

    <!-- Badge 2: 5 Lignes RER -->
    <rect x="195" y="0" width="150" height="38" rx="8" fill="#291B21" stroke="#3B2830" stroke-width="1" />
    <text x="270" y="24" fill="#F1EFEA" font-size="13" font-weight="600" text-anchor="middle">5 LIGNES RER</text>

    <!-- Badge 3: 3D Extrusion -->
    <rect x="360" y="0" width="180" height="38" rx="8" fill="#291B21" stroke="#3B2830" stroke-width="1" />
    <text x="450" y="24" fill="#F1EFEA" font-size="13" font-weight="600" text-anchor="middle">PROFIL 3D &amp; RELIEF</text>

    <!-- Badge 4: Live PRIM -->
    <rect x="555" y="0" width="195" height="38" rx="8" fill="#291B21" stroke="#C9A227" stroke-width="1" />
    <circle cx="575" cy="19" r="4" fill="#C9A227" />
    <text x="657" y="24" fill="#C9A227" font-size="13" font-weight="700" text-anchor="middle">TEMPS RÉEL PRIM</text>
  </g>
</svg>
